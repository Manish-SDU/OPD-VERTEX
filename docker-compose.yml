version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env.example
      - .env
    environment:
      LOCAL_LLM_ENDPOINT: http://ollama:11434
      WHISPER_API_URL: http://whisper:8001
      LLM_MODEL_NAME: llama3.2:1b
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
    volumes:
      - ./:/workspace
      - model-cache:/workspace/app/models
    depends_on:
      - mysql
      - mongo
      - whisper
      - ollama
      - mailhog

  # CPU whisper (default)
  whisper:
    build:
      context: ./whisper_api
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - whisper-models:/models
    environment:
      WHISPER_MODEL: tiny
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8

  # GPU whisper — opt-in via: docker compose --profile gpu up whisper-gpu
  whisper-gpu:
    profiles: [gpu]
    build:
      context: ./whisper_api
      dockerfile: Dockerfile.gpu
    ports:
      - "8001:8001"
    volumes:
      - whisper-models:/models
    environment:
      WHISPER_MODEL: large-v3
      WHISPER_DEVICE: cuda
      WHISPER_COMPUTE_TYPE: float16
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: opd_vertex
      MYSQL_USER: opd_user
      MYSQL_PASSWORD: opd_password
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mysql-data:
  mongo-data:
  model-cache:
  whisper-models:
  ollama-data:
