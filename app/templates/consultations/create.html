{% extends "base.html" %}
{% block content %}
<div class="nc-page">
  <div class="nc-card">
    <h2 class="nc-card__title">New Consultation</h2>

    <form id="create-consultation-form" class="nc-form">
      {# ── Patient lookup ── #}
      <div class="nc-row">
        <div class="nc-group nc-group--id">
          <label class="nc-group__label" for="patient-id-input">Patient ID</label>
          <input class="nc-group__input" type="text" id="patient-id-input" placeholder="e.g. 102" autocomplete="off">
        </div>
        <div class="nc-group nc-group--name">
          <label class="nc-group__label" for="patient-name">Full Name</label>
          <div class="nc-ac-wrap">
            <input class="nc-group__input" type="text" id="patient-name" placeholder="Search by name…" autocomplete="off">
            <ul id="patient-suggestions" class="nc-ac-list"></ul>
          </div>
        </div>
      </div>
      <input type="hidden" name="patient_id" id="patient-id-field">
      <p id="patient-selected" class="nc-msg nc-msg--ok"></p>
      <p id="patient-error" class="nc-msg nc-msg--err"></p>

      {# ── Chief complaint ── #}
      <div class="nc-group">
        <label class="nc-group__label" for="chief-complaint">Chief Complaint</label>
        <input class="nc-group__input" type="text" id="chief-complaint" name="chief_complaint" placeholder="Reason for visit…">
      </div>

      <button type="submit" class="nc-btn">Start Consultation</button>
    </form>

    <div id="consultation-success" class="nc-alert nc-alert--ok" style="display:none;"></div>
    <div id="consultation-error" class="nc-alert nc-alert--err" style="display:none;"></div>
  </div>
</div>

<div id="transcription-ui" style="display:none; margin-top:1.5rem;">
  <div class="nc-card" style="margin-top:0;">
    <h3 class="nc-card__title" style="font-size:1.05rem; margin-bottom:1rem;">Transcription</h3>

    <div style="display:flex; gap:.75rem; flex-wrap:wrap; margin-bottom:1rem; align-items:center;">
      <button id="start-transcription" class="nc-btn" disabled>&#9654; Start Recording</button>
      <button id="stop-transcription" class="nc-btn" style="background:#64748b;" disabled>&#9632; Stop</button>
      <span style="color:var(--muted);font-size:.85rem;">— or —</span>
      <button id="demo-transcript" class="nc-btn" style="background:var(--success);">No mic? Load Demo Transcript</button>
      <button id="save-transcription" class="nc-btn" style="margin-left:auto;" disabled>&#10003; Save Transcription</button>
    </div>

    <textarea id="transcript-display" readonly rows="12"
      style="width:100%;padding:.85rem 1rem;border:1px solid var(--border);border-radius:8px;font-size:.9rem;line-height:1.7;resize:vertical;font-family:inherit;color:var(--text);background:var(--bg);outline:none;"
      placeholder="Transcript will appear here…"></textarea>

    {# hidden accumulators used by JS ─ not visible #}
    <span id="partial-text" style="display:none;"></span>
    <ul id="transcription-chunks" style="display:none;"></ul>

    <div id="transcription-error" style="color:var(--danger);margin-top:.6rem;font-size:.875rem;"></div>
    <div id="transcription-saved" style="color:var(--success);margin-top:.6rem;font-size:.875rem;font-weight:600;"></div>
  </div>
</div>
<script src="/static/js/consultation_create.js"></script>
{% endblock %}
