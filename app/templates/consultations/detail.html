{% extends "base.html" %}
{% block content %}
<section class="card">
  {% if consultation %}
  <h2>Consultation {{ consultation.id }}</h2>
  <p>Status: {{ consultation.status }}</p>
  <p>Patient: {{ consultation.patient_id }}</p>
  <p><a href="/review/{{ consultation.id }}">Open review workflow</a></p>
  {% else %}
  <h2>Consultation not found</h2>
  {% endif %}
</section>
{% endblock %}
