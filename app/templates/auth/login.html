{% extends "base.html" %}
{% block content %}
<section class="card narrow">
  <h2>Mock Login</h2>
  <p>Placeholder authentication only. No real session security yet.</p>
  {% if message %}<p>{{ message }}</p>{% endif %}
  {% if staff %}<p>Authenticated as {{ user.email }}.</p>{% endif %}
  <form method="post" action="/login">
    <label>Username <input type="email" name="email" value="john@example.com"></label>
    <label>Password <input type="password" name="password" value="password"></label>
    <button type="submit">Login</button>
  </form>
</section>
{% endblock %}
