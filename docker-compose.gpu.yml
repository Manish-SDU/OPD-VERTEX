# GPU override — use with:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
# Replaces the CPU whisper with large-v3 (float16, CUDA) and gives Ollama GPU access.
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  whisper:
    build:
      context: ./whisper_api
      dockerfile: Dockerfile.gpu
    environment:
      WHISPER_MODEL: large-v3
      WHISPER_DEVICE: cuda
      WHISPER_COMPUTE_TYPE: float16
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:8001/health | grep -qE '200|503'"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 600s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
